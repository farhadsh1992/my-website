<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farhad Shadmand</title>
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      var theme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body class="video-page">
  <header class="site-nav site-nav--overlay">
    <a href="index.html" class="site-logo" data-en="Farhad Shadmand" data-pt="Farhad Shadmand" data-nl="Farhad Shadmand" data-de="Farhad Shadmand" data-fr="Farhad Shadmand" data-it="Farhad Shadmand" data-es="Farhad Shadmand">Farhad Shadmand</a>
    <nav class="site-nav-links">
      <a href="cv.html" data-en="CV" data-pt="CV" data-nl="CV" data-de="Lebenslauf" data-fr="CV" data-it="CV" data-es="CV">CV</a>
      <a href="blog.html" data-en="Blog" data-pt="Blog" data-nl="Blog" data-de="Blog" data-fr="Blog" data-it="Blog" data-es="Blog">Blog</a>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark and light mode">🌙</button>
      <select id="lang-select" class="icon-btn lang-select" aria-label="Switch language">
        <option value="en">EN</option>
        <option value="pt">PT</option>
        <option value="nl">NL</option>
        <option value="de">DE</option>
        <option value="fr">FR</option>
        <option value="it">IT</option>
        <option value="es">ES</option>
      </select>
    </nav>
  </header>

  <div id="video-link" class="video-link" role="link" tabindex="0" aria-label="Enter site — view CV">
    <video
      class="bg-video"
      autoplay
      muted
      loop
      playsinline
      poster="assets/video/poster.jpg"
    >
      <source src="assets/video/intro.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <div class="overlay">
      <h1 class="name"><span class="crowned-letter"><span class="crown" aria-hidden="true">👑</span>F</span>arhad Shadmand</h1>
      <p class="cta" data-en="Click to view my CV" data-pt="Clique para ver o meu CV" data-nl="Klik om mijn cv te bekijken" data-de="Klicken Sie, um meinen Lebenslauf zu sehen" data-fr="Cliquez pour voir mon CV" data-it="Clicca per vedere il mio CV" data-es="Haz clic para ver mi CV">Click to view my CV</p>
      <nav class="lang-picker" aria-label="Choose CV language">
        <a href="cv.html" class="lang-pick" data-lang="en">EN</a>
        <a href="cv.html" class="lang-pick" data-lang="pt">PT</a>
        <a href="cv.html" class="lang-pick" data-lang="nl">NL</a>
        <a href="cv.html" class="lang-pick" data-lang="de">DE</a>
        <a href="cv.html" class="lang-pick" data-lang="fr">FR</a>
        <a href="cv.html" class="lang-pick" data-lang="it">IT</a>
        <a href="cv.html" class="lang-pick" data-lang="es">ES</a>
      </nav>
    </div>
  </div>

  <script src="site.js"></script>
</body>
</html>
