      alt=""
      onerror="this.style.display='none'"

          <span class="avatar-fallback">FS</span>
          <img
            class="avatar-img"
            src="assets/images/blog-profile.jpg"
            alt="Farhad Shadmand"
            onerror="this.style.display='none'"
            onload="this.previousElementSibling.style.display='none'"
          >
        </div>
        <div class="profile-info">
          <h1 data-en="Life Blog" data-pt="Blog Pessoal" data-nl="Levensblog" data-de="Lebens-Blog" data-fr="Blog de vie" data-it="Blog di vita" data-es="Blog de vida">Life Blog</h1>

            data-it="Note sulla vita fuori dal laboratorio — viaggi, progetti e tutto ciò che mi passa per la mente."
            data-es="Notas sobre la vida fuera del laboratorio — viajes, proyectos y lo que se me ocurra."
          >
            Notes on life outside the lab — travel, projects, and whatever else is on my mind.
          </p>

    <div class="cv-main" style="margin-top: 2.5rem;">
      <section class="cv-section" style="margin-top: 0;">
        <ul class="blog-list" id="blog-list"></ul>

        <p id="blog-note" class="blog-note" data-en="More posts coming soon." data-pt="Mais posts brevemente." data-nl="Meer berichten binnenkort." data-de="Weitere Beiträge folgen in Kürze." data-fr="D'autres articles arrivent bientôt." data-it="Altri post in arrivo." data-es="Más publicaciones próximamente.">More posts coming soon.</p>
